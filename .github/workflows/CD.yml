name: WebUI_BE_CD
on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Github Repository
        uses: actions/checkout@v4

      - name: Copy project to Remote Server (SCP)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          source: "./*"
          target: "/home/elaina/dockers/WebUI_BE/service"
          rm: true

      - name: Deploy with docker compose (SSH)
        uses: appleboy/ssh-action@v1.0.3
        env:
          # DB
          DB_URL: ${{ secrets.DB_URL }}
          DB_CONFIG_URL: ${{ secrets.DB_CONFIG_URL }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          # Discord
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
          DISCORD_REDIRECT_URI: ${{ secrets.DISCORD_REDIRECT_URI }}
          DISCORD_TOKEN_URI: ${{ secrets.DISCORD_TOKEN_URI }}
          DISCORD_USER_URI: ${{ secrets.DISCORD_USER_URI }}
          DISCORD_GUILDS_URI: ${{ secrets.DISCORD_GUILDS_URI }}
          # FE
          FRONT_REDIRECT_URI: ${{ secrets.FRONT_REDIRECT_URI }}
          REGISTER_URI: ${{ secrets.REGISTER_URI }}
          # Spring
          SPRING_DATA_REDIS_HOST: redis
          SPRING_PROFILES_ACTIVE: ${{ secrets.SPRING_PROFILES_ACTIVE }}
          # Jwt
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          script_stop: true
          command_timeout: 30m
          envs: >-
            DB_URL,
            DB_CONFIG_URL,
            DB_USER,
            DB_PASSWORD,
            DISCORD_CLIENT_ID,
            DISCORD_CLIENT_SECRET,
            DISCORD_REDIRECT_URI,
            DISCORD_TOKEN_URI,
            DISCORD_USER_URI,
            DISCORD_GUILDS_URI,
            FRONT_REDIRECT_URI,
            REGISTER_URI,
            JWT_SECRET,
            SPRING_DATA_REDIS_HOST,
            SPRING_PROFILES_ACTIVE
          script: |
            set -euo pipefail
            cd /home/elaina/dockers/WebUI_BE/service
            docker compose down
            docker compose up -d --build
