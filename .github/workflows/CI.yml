name: WebUI_BE_CI

on:
  pull_request:
    branches: ["main", "develope"]
  push:
    branches: ["develope"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: AuthServerPlatform
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Verify formatting, static analysis, tests, and build
        run: ./gradlew clean check bootJar --no-daemon

  container:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build container image
        run: docker build --tag webui-be:${{ github.sha }} .
