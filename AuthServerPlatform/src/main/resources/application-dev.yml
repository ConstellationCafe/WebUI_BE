spring:
  datasource:
    primary:
      url: ${DB_URL}
      username: ${DB_USER}
      password: ${DB_PASSWORD}
      driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    primary:
      properties:
        hibernate:
          show_sql: true
      hibernate:
        ddl-auto: update
    secondary:
      properties:
        hibernate:
          show_sql: true
      hibernate:
        ddl-auto: none
#  data:
#    redis:
#      host: localhost
#      port: 6379
#      timeout: 60000
  web:
    resources:
      add-mappings: false
  mvc:
    throw-exception-if-no-handler-found: true
jwt:
  secret: ${JWT_SECRET}