server:
  port: 4003
#  ssl:
#    enabled: true
#    certificate: classpath:certs/localhost+2.pem
#    certificate-private-key: classpath:certs/localhost+2-key.pem
spring:
  datasource:
    primary:
      url: ${DB_URL}
      username: ${DB_USER}
      password: ${DB_PASSWORD}
      driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    primary:
      properties:
        hibernate:
          show_sql: true
      hibernate:
        ddl-auto: update
    secondary:
      properties:
        hibernate:
          show_sql: true
      hibernate:
        ddl-auto: none
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 60000
  #  mail:
  #    host: smtp.gmail.com
  #    port: 587
  #    username: ${GMAIL_USERNAME}
  #    password: ${GMAIL_APP_PASSWORD}
  #    properties:
  #      mail:
  #        smtp:
  #          auth: true
  #          timeout: 5000
  #          starttls:
  #            enable: true
  web:
    resources:
      add-mappings: false
#  mvc:
#    throw-exception-if-no-handler-found: true
discord:
  client-id: ${DISCORD_CLIENT_ID}
  client-secret: ${DISCORD_CLIENT_SECRET}
  token-uri: ${DISCORD_TOKEN_URI}
  user-uri: ${DISCORD_USER_URI}
  guilds-uri: ${DISCORD_GUILDS_URI}
  redirect-uri: ${DISCORD_REDIRECT_URI}
front:
  redirect-uri: ${FRONT_REDIRECT_URI}
jwt:
  secret: ${JWT_SECRET}

