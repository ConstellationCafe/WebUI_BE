spring:
  datasource:
    primary:
      url: jdbc:h2:mem:testdb
      driver-class-name: org.h2.Driver
      username: sa
      password:

  jpa:
    open-in-view: false
    properties:
      hibernate:
        show_sql: true
    hibernate:
      ddl-auto: update
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 60000

discord:
  client-id: ${DISCORD_CLIENT_ID}
  client-secret: ${DISCORD_CLIENT_SECRET}
  token-uri: ${DISCORD_TOKEN_URI}
  user-uri: ${DISCORD_USER_URI}
  redirect-uri: ${DISCORD_REDIRECT_URI}
front:
  redirect-uri: ${FRONT_REDIRECT_URI}
jwt:
  secret: ${JWT_SECRET}