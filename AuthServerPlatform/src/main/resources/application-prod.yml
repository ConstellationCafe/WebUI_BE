server:
  port: 4003

spring:
  datasource:
    constellation:
      url: ${DB_URL}
      username: ${DB_USER}
      password: ${DB_PASSWORD}
      driver-class-name: com.mysql.cj.jdbc.Driver
    config_db:
      url: ${DB_CONFIG_URL}
      username: ${DB_USER}
      password: ${DB_PASSWORD}
      driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    primary:
      properties:
        hibernate:
          show_sql: false
      hibernate:
        ddl-auto: validate
    secondary:
      properties:
        hibernate:
          show_sql: false
      hibernate:
        ddl-auto: none
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 5s
  web:
    resources:
      add-mappings: false

discord:
  client-id: ${DISCORD_CLIENT_ID}
  client-secret: ${DISCORD_CLIENT_SECRET}
  token-uri: ${DISCORD_TOKEN_URI}
  user-uri: ${DISCORD_USER_URI}
  guilds-uri: ${DISCORD_GUILDS_URI}
  redirect-uri: ${DISCORD_REDIRECT_URI}

front:
  redirect-uri: ${FRONT_REDIRECT_URI}

jwt:
  secret: ${JWT_SECRET}
