server:
  shutdown: graceful

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE}
  application:
    name: AuthServerPlatform
  lifecycle:
    timeout-per-shutdown-phase: 30s

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,prometheus
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
